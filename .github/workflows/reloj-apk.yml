# App del reloj (Galaxy Watch, Wear OS): compila el APK firmado siempre con la
# misma clave (se instala encima de la anterior) y lo deja como artefacto y
# como versión «reloj-<n>» del repo, para bajarlo desde el móvil.
# Ver docs/RELOJ.md.
name: Reloj (APK Wear OS)

on:
  push:
    paths:
      - 'reloj/**'
      - '.github/workflows/reloj-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reloj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk "okhub-reloj-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: okhub-reloj-${{ github.run_number }}
          path: reloj/okhub-reloj-${{ github.run_number }}.apk
      - name: Publicar versión (solo desde main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "reloj-${GITHUB_RUN_NUMBER}" "okhub-reloj-${GITHUB_RUN_NUMBER}.apk" \
            --title "Reloj ${GITHUB_RUN_NUMBER}" --notes "App Ok Hub para el Galaxy Watch (commit ${GITHUB_SHA::7}). Instalar: docs/RELOJ.md" --latest=false
